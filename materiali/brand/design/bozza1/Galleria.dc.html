<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#40444a;} a{color:inherit;text-decoration:none;}</style>
</helmet>
<div style="background:#40444a;color:#f4f2ee;font-family:Barlow,sans-serif;min-height:100vh;">

  <header style="position:sticky;top:0;z-index:50;background:#40444a;border-bottom:1px solid #5c6067;">
    <div style="max-width:1280px;margin:0 auto;padding:14px 32px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;">
      <a href="./Home.dc.html" style="display:flex;align-items:center;gap:12px;">
        <div style="width:44px;height:44px;background:oklch(0.68 0.19 42);display:flex;align-items:center;justify-content:center;font-family:Oswald;font-weight:700;font-size:16px;color:#1a1210;flex-shrink:0;">FL</div>
        <div style="display:flex;flex-direction:column;line-height:1.15;">
          <span style="font-family:Oswald;font-size:17px;font-weight:600;letter-spacing:0.02em;">LOMBARDO SERRAMENTI</span>
          <span style="font-size:10.5px;color:#c5c7cb;letter-spacing:0.14em;text-transform:uppercase;white-space:nowrap;">Officina Artigiana dal 1968</span>
        </div>
      </a>
      <nav style="display:flex;flex-wrap:wrap;gap:clamp(16px,3vw,32px);align-items:center;font-size:14.5px;font-weight:500;">
        <a href="./Home.dc.html" style="color:#e4e2dd;white-space:nowrap;">Home</a>
        <a href="./ChiSiamo.dc.html" style="color:#e4e2dd;white-space:nowrap;">Chi Siamo</a>
        <a href="./Prodotti.dc.html" style="color:#e4e2dd;white-space:nowrap;">Prodotti</a>
        <a href="./Galleria.dc.html" style="color:oklch(0.68 0.19 42);white-space:nowrap;">Galleria</a>
        <a href="./Contatti.dc.html" style="color:#e4e2dd;white-space:nowrap;">Contatti</a>
      </nav>
      <a href="./Preventivo.dc.html" style="background:oklch(0.68 0.19 42);color:#1a1210;padding:12px 22px;font-weight:600;font-size:14px;white-space:nowrap;">Richiedi Preventivo</a>
    </div>
  </header>

  <section style="max-width:1280px;margin:0 auto;padding:clamp(60px,8vw,100px) 32px 20px;">
    <div style="color:oklch(0.68 0.19 42);font-weight:600;letter-spacing:0.12em;text-transform:uppercase;font-size:13px;margin-bottom:12px;">Galleria</div>
    <h1 style="font-family:Oswald;font-weight:700;font-size:clamp(32px,5vw,48px);margin:0 0 30px;line-height:1.1;">Le realizzazioni dell'officina.</h1>
    <div style="display:flex;flex-wrap:wrap;gap:10px;">
      <button onClick="{{ setFilter('tutti') }}" style="background:{{ filter_tutti_bg }};color:{{ filter_tutti_color }};border:1px solid #6d7177;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;">Tutti</button>
      <button onClick="{{ setFilter('cancelli') }}" style="background:{{ filter_cancelli_bg }};color:{{ filter_cancelli_color }};border:1px solid #6d7177;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;">Cancelli</button>
      <button onClick="{{ setFilter('ringhiere') }}" style="background:{{ filter_ringhiere_bg }};color:{{ filter_ringhiere_color }};border:1px solid #6d7177;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;">Ringhiere</button>
      <button onClick="{{ setFilter('portoni') }}" style="background:{{ filter_portoni_bg }};color:{{ filter_portoni_color }};border:1px solid #6d7177;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;">Portoni</button>
      <button onClick="{{ setFilter('su misura') }}" style="background:{{ filter_sumisura_bg }};color:{{ filter_sumisura_color }};border:1px solid #6d7177;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;">Su Misura</button>
    </div>
  </section>

  <section style="max-width:1280px;margin:0 auto;padding:36px 32px 90px;">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;">
      <sc-for list="{{ visibleItems }}" as="item" hint-placeholder-count="9">
        <div style="height:230px;background:repeating-linear-gradient(45deg,#54585f,#54585f 10px,#484c53 10px,#484c53 20px);display:flex;flex-direction:column;justify-content:space-between;padding:12px;">
          <span style="align-self:flex-start;background:oklch(0.68 0.19 42);color:#1a1210;font-size:11px;font-weight:600;padding:4px 10px;text-transform:uppercase;letter-spacing:0.06em;">{{ item.cat }}</span>
          <span style="font-family:monospace;font-size:10.5px;color:#d0d1d3;">{{ item.label }}</span>
        </div>
      </sc-for>
    </div>
  </section>

  <footer style="background:#2c2f33;border-top:1px solid #5c6067;">
    <div style="max-width:1280px;margin:0 auto;padding:30px 32px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;font-size:12.5px;color:#9a9ca0;">
      <span>&copy; 2026 Lombardo Serramenti Officina Artigiana &middot; P.IVA 00000000000</span>
      <a href="./Contatti.dc.html" style="color:#aaacb0;">Via dell'Artigianato, 12 &ndash; Palermo</a>
    </div>
  </footer>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { filter: 'tutti' };
  items = [
    {cat:'cancelli', label:'[cancello battente in ferro]'},
    {cat:'cancelli', label:'[cancello scorrevole motorizzato]'},
    {cat:'ringhiere', label:'[ringhiera balcone inox]'},
    {cat:'ringhiere', label:'[balaustra scala interna]'},
    {cat:'portoni', label:'[portone sezionale garage]'},
    {cat:'portoni', label:'[serranda di sicurezza]'},
    {cat:'su misura', label:'[pergolato in acciaio]'},
    {cat:'su misura', label:'[insegna in ferro]'},
    {cat:'cancelli', label:'[cancello pedonale]'},
    {cat:'ringhiere', label:'[recinzione in ferro]'},
    {cat:'portoni', label:'[portone basculante]'},
    {cat:'su misura', label:'[scala a chiocciola]'},
  ];
  colorsFor(active) {
    return active
      ? { bg: 'oklch(0.68 0.19 42)', color: '#1a1210' }
      : { bg: 'transparent', color: '#d4d2cd' };
  }
  renderVals() {
    const f = this.state.filter;
    const cats = ['tutti', 'cancelli', 'ringhiere', 'portoni', 'su misura'];
    const keys = { 'tutti':'tutti', 'cancelli':'cancelli', 'ringhiere':'ringhiere', 'portoni':'portoni', 'su misura':'sumisura' };
    const vals = {};
    cats.forEach(c => {
      const col = this.colorsFor(f === c);
      vals['filter_' + keys[c] + '_bg'] = col.bg;
      vals['filter_' + keys[c] + '_color'] = col.color;
    });
    return {
      ...vals,
      setFilter: (c) => this.setState({ filter: c }),
      visibleItems: f === 'tutti' ? this.items : this.items.filter(i => i.cat === f),
    };
  }
}

</script>
</body>
</html>
